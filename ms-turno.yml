spring:
  datasource:
    url: jdbc:mysql://localhost:3306/turno_db?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic
      compression:
        request:
          enabled: true
        response:
          enabled: true

logging:
  level:
    com.patitas.turno.adapter.out.feign: DEBUG

info:
  app:
    name: ms-turno
    description: Microservicio de gestión de turnos - Patitas Felices
    version: 1.0.0
